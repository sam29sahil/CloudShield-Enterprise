{% extends "base.html" %}

{% block title %}

Settings

{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">

                Account Settings

            </h2>

            <p class="text-muted">

                Manage your CloudShield account.

            </p>

        </div>

    </div>

    <div class="row">

        <!-- Profile -->

        <div class="col-lg-6">

            <div class="card shadow-sm mb-4">

                <div class="card-header">

                    <h5 class="mb-0">

                        Profile

                    </h5>

                </div>

                <div class="card-body">

                    <form>

                        <div class="mb-3">

                            <label class="form-label">

                                Username

                            </label>

                            <input
                                class="form-control"
                                value="{{ user.username }}"
                                readonly>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                class="form-control"
                                value="{{ user.email }}"
                                readonly>

                        </div>

                        <button
                            class="btn btn-primary"
                            disabled>

                            Save Changes

                        </button>

                    </form>

                </div>

            </div>

        </div>

        <!-- Password -->

        <div class="col-lg-6">

            <div class="card shadow-sm mb-4">

                <div class="card-header">

                    <h5 class="mb-0">

                        Change Password

                    </h5>

                </div>

                <div class="card-body">

                    <form>

                        <div class="mb-3">

                            <label class="form-label">

                                Current Password

                            </label>

                            <input
                                type="password"
                                class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                New Password

                            </label>

                            <input
                                type="password"
                                class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Confirm Password

                            </label>

                            <input
                                type="password"
                                class="form-control">

                        </div>

                        <button
                            class="btn btn-warning"
                            disabled>

                            Update Password

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- Preferences -->

    <div class="card shadow-sm">

        <div class="card-header">

            <h5 class="mb-0">

                Preferences

            </h5>

        </div>

        <div class="card-body">

            <div class="form-check form-switch mb-3">

                <input
                    class="form-check-input"
                    type="checkbox"
                    checked
                    disabled>

                <label class="form-check-label">

                    Enable Notifications

                </label>

            </div>

            <div class="form-check form-switch mb-3">

                <input
                    class="form-check-input"
                    type="checkbox"
                    checked
                    disabled>

                <label class="form-check-label">

                    Dark Mode (Coming Soon)

                </label>

            </div>

            <div class="form-check form-switch">

                <input
                    class="form-check-input"
                    type="checkbox"
                    disabled>

                <label class="form-check-label">

                    Email Alerts

                </label>

            </div>

        </div>

    </div>

</div>

{% endblock %}
