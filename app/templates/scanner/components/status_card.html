<div class="card shadow-sm border-0 mb-4" id="scan-status-card">

    <div class="card-header d-flex justify-content-between align-items-center">

        <h5 class="mb-0">

            <i class="bi bi-shield-check"></i>

            Live Scan Status

        </h5>

        <span id="scan-status-badge"
              class="badge bg-secondary">

            Waiting

        </span>

    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="text-muted small">
                    Target
                </label>

                <div id="scan-target">

                    --

                </div>

            </div>

            <div class="col-md-6 mb-3">

                <label class="text-muted small">
                    Tool
                </label>

                <div id="scan-tool">

                    --

                </div>

            </div>

            <div class="col-md-6">

                <label class="text-muted small">
                    Current Stage
                </label>

                <div id="scan-stage">

                    Waiting...

                </div>

            </div>

            <div class="col-md-6">

                <label class="text-muted small">
                    Elapsed Time
                </label>

                <div id="scan-time">

                    00:00

                </div>

            </div>

        </div>

    </div>

</div>
