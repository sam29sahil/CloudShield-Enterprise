{% extends "base.html" %}

{% block title %}Azure Security Assessment{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">

                        Azure Security Assessment

                    </h3>

                </div>

                <div class="card-body">

                    <p class="text-muted">

                        Connect your Azure subscription and run a complete
                        CloudShield security assessment.

                    </p>

                    <form
                        method="POST"
                        action="{{ url_for('azure.scan') }}"
                    >

                        <div class="mb-3">

                            <label class="form-label">

                                Azure Subscription ID

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="subscription_id"
                                placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                                required
                            >

                        </div>

                        <button
                            class="btn btn-primary"
                            type="submit"
                        >

                            Run Security Assessment

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
